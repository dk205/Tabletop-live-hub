<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Tabletop-Live</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>

<div id="unity-container" class="unity-desktop">
  <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-warning"></div>

  <div id="unity-footer">
    <div id="unity-logo-title-footer"></div>
    <div id="unity-fullscreen-button"></div>
    <div id="unity-build-title">Tabletop-Live</div>
  </div>
</div>

<!-- 🔥 FIREBASE (NEW) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

let unityInstance = null;

const canvas = document.querySelector("#unity-canvas");

/* =========================
   UNITY SETUP
========================= */

function unityShowBanner(msg, type) {
  const warningBanner = document.querySelector("#unity-warning");

  const div = document.createElement("div");
  div.innerHTML = msg;
  warningBanner.appendChild(div);

  if (type === "error") {
    div.style = "background:red;padding:10px;";
  } else if (type === "warning") {
    div.style = "background:yellow;padding:10px;";
    setTimeout(() => {
      warningBanner.removeChild(div);
    }, 5000);
  }
}

const buildUrl = "Build";
const loaderUrl = buildUrl + "/unity.loader.js";

const config = {
  arguments: [],
  dataUrl: buildUrl + "/unity.data",
  frameworkUrl: buildUrl + "/unity.framework.js",
  codeUrl: buildUrl + "/unity.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "Tabletop-Live",
  productVersion: "0.1.0",
  showBanner: unityShowBanner
};

/* Mobile setup */
if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
  const meta = document.createElement("meta");
  meta.name = "viewport";
  meta.content =
    "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
  document.getElementsByTagName("head")[0].appendChild(meta);

  document.querySelector("#unity-container").className = "unity-mobile";
  canvas.className = "unity-mobile";
} else {
  canvas.style.width = "960px";
  canvas.style.height = "600px";
}

document.querySelector("#unity-loading-bar").style.display = "block";

/* Load Unity */
const script = document.createElement("script");
script.src = loaderUrl;

script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    document.querySelector("#unity-progress-bar-full").style.width =
      100 * progress + "%";
  })
    .then((instance) => {

      unityInstance = instance;

      document.querySelector("#unity-loading-bar").style.display = "none";

      document.querySelector("#unity-fullscreen-button").onclick = () => {
        unityInstance.SetFullscreen(1);
      };

      console.log("Unity Ready ✔");

    })
    .catch((message) => {
      alert(message);
    });
};

document.body.appendChild(script);

/* =========================
   🔥 FIREBASE SETUP (NEW)
========================= */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "tabletop-server.firebaseapp.com",
  databaseURL: "https://tabletop-server-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "tabletop-server"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* =========================
   🔥 FIREBASE LISTENER (NEW)
========================= */

db.ref("commands/move").on("value", (snapshot) => {

  const data = snapshot.val();
  if (!data) return;

  console.log("Firebase command received:", data);

  if (!unityInstance) {
    console.warn("Unity not ready yet");
    return;
  }

  if (data.type === "MOVE_UNIT") {

    unityInstance.SendMessage(
      "BattleClientManager",
      "MoveUnitCommand",
      data.payload
    );
  }
});

</script>

</body>
</html>
