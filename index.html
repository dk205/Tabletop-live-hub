<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop Live Hub</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            height: 60px;
            background: #141414;
            border-bottom: 1px solid #2c2c2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #liveStatus {
            font-weight: bold;
            color: gray;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .leftPanel {
            flex: 2;
            background: black;
            border-right: 1px solid #2c2c2c;
        }

        .leftPanel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .rightPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        .viewerHeader {
            padding: 15px;
            border-bottom: 1px solid #2c2c2c;
            background: #161616;
        }

        .viewerHeader h2 {
            margin: 0;
            font-size: 18px;
        }

        .viewerHeader p {
            margin-top: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .controls {
            padding: 10px 15px;
            border-bottom: 1px solid #2c2c2c;
            background: #151515;
        }

        button {
            padding: 10px 12px;
            background: #2d6cdf;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #1f56c0;
        }

        .unityContainer {
            flex: 1;
            background: #000;
        }

        .unityContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footerInfo {
            padding: 12px;
            border-top: 1px solid #2c2c2c;
            background: #161616;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <div class="title">⚔ Tabletop Live Hub</div>
    <div id="liveStatus">● CHECKING...</div>
</header>

<div class="container">

    <div class="leftPanel">
        <iframe src="https://www.youtube-nocookie.com/embed/wak4aJsvEEM"></iframe>
    </div>

    <div class="rightPanel">

        <div class="viewerHeader">
            <h2>Interactive Battlefield firebase</h2>
            <p>Real-time digital battlefield viewer</p>
        </div>

        <div id="message" style="padding:10px;"></div>

        <div class="controls">
            <button onclick="moveUnit()">Move Unit</button>
        </div>

        <div class="unityContainer">
            <iframe src="unity/index.html"></iframe>
        </div>

        <div class="footerInfo">
            Tabletop Live Hub • Experimental RTS-style tabletop viewer system
        </div>

    </div>
</div>

<!-- ========================= -->
<!-- 🔴 FIREBASE ADDITIONS START -->
<!-- ========================= -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
/* 🔴 NEW: Firebase config */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "tabletop-server.firebaseapp.com",
    databaseURL: "https://tabletop-server-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "tabletop-server"
};

/* 🔴 NEW: init Firebase */
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 🔥 UPDATED BUTTON (now sends to Firebase instead of iframe directly) */
function moveUnit() {
    console.log("Button clicked");
    document.getElementById("message").innerText = "Hello World";

    /* 🔴 NEW: send command to Firebase */
    db.ref("commands/move").set({
        type: "MOVE_UNIT",
        payload: "10-40-1,15,0,8",
        timestamp: Date.now()
    });
}
</script>

<!-- ======================= -->
<!-- 🔴 FIREBASE ADDITIONS END -->
<!-- ======================= -->

<script>
const API_KEY = "AIzaSy...";
const CHANNEL_ID = "UCJf90pitXPeGyEpL1T7zfig";

async function checkLiveStatus() {
    const status = document.getElementById("liveStatus");

    try {
        const response = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`
        );

        const data = await response.json();

        if (data.items && data.items.length > 0) {
            status.innerHTML = "● LIVE";
            status.style.color = "red";
        } else {
            status.innerHTML = "● OFFLINE";
            status.style.color = "gray";
        }

    } catch (error) {
        status.innerHTML = "● ERROR";
        status.style.color = "orange";
    }
}

checkLiveStatus();
setInterval(checkLiveStatus, 30000);
</script>

</body>
</html>
