<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop Live Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            height: 60px;
            background: #141414;
            border-bottom: 1px solid #2c2c2c;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #liveStatus {
            font-weight: bold;
            color: gray;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .leftPanel {
            flex: 2;
            background: black;
            border-right: 1px solid #2c2c2c;
        }

        .leftPanel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .rightPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        .viewerHeader {
            padding: 15px;
            border-bottom: 1px solid #2c2c2c;
            background: #161616;
        }

        .viewerHeader h2 {
            margin: 0;
            font-size: 18px;
        }

        .viewerHeader p {
            margin-top: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .controls {
            padding: 10px 15px;
            border-bottom: 1px solid #2c2c2c;
            background: #151515;
        }

        button {
            padding: 10px 12px;
            background: #2d6cdf;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #1f56c0;
        }

        .unityContainer {
            flex: 1;
            background: #000;
        }

        .unityContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footerInfo {
            padding: 12px;
            border-top: 1px solid #2c2c2c;
            background: #161616;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="title">⚔ Tabletop Live Hub</div>
        <div id="liveStatus">● CHECKING...</div>
    </header>

    <!-- MAIN -->
    <div class="container">

        <!-- LEFT: YOUTUBE -->
        <div class="leftPanel">
            <iframe
                src="https://www.youtube-nocookie.com/embed/wak4aJsvEEM"
                title="YouTube Live Stream"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <!-- RIGHT: UNITY -->
        <div class="rightPanel">

            <div class="viewerHeader">
                <h2>Interactive Battlefield</h2>
                <p>Real-time digital battlefield viewer</p>
            </div>

            <!-- CONTROLS -->
            <div class="controls">
                <button onclick="moveUnit()">Move Unit</button>
            </div>

            <div class="unityContainer">
                <iframe src="unity/index.html"></iframe>
            </div>

            <div class="footerInfo">
                Tabletop Live Hub • Experimental RTS-style tabletop viewer system
            </div>

        </div>
    </div>

    <script>
        // 🔥 UNITY COMMAND
        function moveUnit() {

            const command = "10-40-1,15,0,8";

            // If unityInstance is globally exposed (best case)
            if (typeof unityInstance !== "undefined" && unityInstance) {

                unityInstance.SendMessage(
                    "BattleClientManager",
                    "MoveUnitCommand",
                    command
                );

                return;
            }

            // Fallback: iframe bridge (optional future-proofing)
            const iframe = document.querySelector(".unityContainer iframe");

            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    type: "MOVE_UNIT",
                    payload: command
                }, "*");
            }
        }


        // 🔵 YOUTUBE LIVE STATUS
        const API_KEY = "AIzaSyAgIvaNDbmMkoaLZ1D5mhr2yTXgx-JNpDo";
        const CHANNEL_ID = "UCJf90pitXPeGyEpL1T7zfig";

        async function checkLiveStatus() {

            const status = document.getElementById("liveStatus");

            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`
                );

                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    status.innerHTML = "● LIVE";
                    status.style.color = "red";
                } else {
                    status.innerHTML = "● OFFLINE";
                    status.style.color = "gray";
                }

            } catch (error) {
                status.innerHTML = "● ERROR";
                status.style.color = "orange";
                console.error(error);
            }
        }

        checkLiveStatus();
        setInterval(checkLiveStatus, 30000);

    </script>

</body>

</html>
