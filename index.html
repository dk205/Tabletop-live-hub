<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop Live Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        /* HEADER */
        header {
            height: 60px;
            background: #141414;
            border-bottom: 1px solid #2c2c2c;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #liveStatus {
            font-weight: bold;
            color: gray;
        }

        /* MAIN LAYOUT */
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* LEFT */
        .leftPanel {
            flex: 2;
            background: black;
            border-right: 1px solid #2c2c2c;
        }

        .leftPanel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* RIGHT */
        .rightPanel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        .viewerHeader {
            padding: 15px;
            border-bottom: 1px solid #2c2c2c;
            background: #161616;
        }

        .viewerHeader h2 {
            margin: 0;
            font-size: 18px;
        }

        .viewerHeader p {
            margin-top: 5px;
            color: #aaa;
            font-size: 13px;
        }

        .unityContainer {
            flex: 1;
            background: black;
        }

        .unityContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footerInfo {
            padding: 12px;
            border-top: 1px solid #2c2c2c;
            background: #161616;
            color: #888;
            font-size: 12px;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            body {
                overflow: auto;
            }

            .container {
                flex-direction: column;
                height: auto;
            }

            .leftPanel {
                height: 300px;
            }

            .rightPanel {
                height: calc(100vh - 360px);
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="title">⚔ Tabletop Live Hub2</div>
        <div id="liveStatus">● CHECKING...</div>
    </header>

    <!-- MAIN -->
    <div class="container">

        <!-- LEFT PANEL -->
        <div class="leftPanel">
            <iframe
                src="https://www.youtube-nocookie.com/embed/wak4aJsvEEM"
                title="YouTube Live Stream"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <!-- RIGHT PANEL -->
        <div class="rightPanel">

            <div class="viewerHeader">
                <h2>Interactive Battlefield2</h2>
                <p>Real-time digital battlefield viewer</p>
            </div>

            <div class="unityContainer">
                <iframe src="unity/index.html"></iframe>
            </div>

            <div class="footerInfo">
                Tabletop Live Hub • Experimental RTS-style tabletop viewer system
            </div>

        </div>

    </div>

    <!-- UNITY COMMANDS -->
    <script>
        let unityInstance = null;

        function moveRaptors() {
            if (!unityInstance) return;

            unityInstance.SendMessage(
                'BattleClientManager',
                'MoveUnitCommand',
                '10-40-1,15,0,8'
            );
        }

        function nextPhase() {
            if (!unityInstance) return;

            unityInstance.SendMessage(
                'BattleClientManager',
                'AdvancePhase'
            );
        }
    </script>

    <!-- LIVE STATUS -->
    <script>
        const API_KEY = "YOUR_API_KEY_HERE"; // ⚠️ restrict this in Google Cloud Console
        const CHANNEL_ID = "UCJf90pitXPeGyEpL1T7zfig";

        async function checkLiveStatus() {
            const status = document.getElementById("liveStatus");

            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${API_KEY}`
                );

                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    status.innerHTML = "● LIVE";
                    status.style.color = "red";
                } else {
                    status.innerHTML = "● OFFLINE";
                    status.style.color = "gray";
                }

            } catch (err) {
                console.error(err);
                status.innerHTML = "● ERROR";
                status.style.color = "orange";
            }
        }

        checkLiveStatus();
        setInterval(checkLiveStatus, 30000);
    </script>

</body>

</html>
